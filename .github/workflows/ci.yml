name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      # Keep the pnpm content-addressable store between runs. Every job in every
      # workflow installs the same ~540-package tree, and a cold store makes the
      # install (documented at 121-141s) dominate the build. `pnpm store path`
      # is constant on a given OS, so the key is too.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '/home/runner/.local/share/pnpm/store' || '~/Library/pnpm/store' }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @codent/extension exec wxt prepare

      - name: Build
        # Must precede Lint and Typecheck: the 266 validate/test/smoke scripts
        # import their own package's `dist` (e.g. `../dist/dev.mjs`), and
        # cross-package imports resolve through the `exports` map, which points
        # at `dist`. On a dist-less checkout `import/no-unresolved` and `tsc`
        # report ~280 phantom errors for imports that are correct by
        # construction — the scripts' own `build &&` prefix is what satisfies
        # them locally. See the "Build state is a lint/typecheck prerequisite"
        # note in eslint.config.cjs.
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # @codent/app is the only package with a node:test suite; it imports
        # its own dist entry, so it must run after the build above.
        run: pnpm --filter @codent/app test

      - name: Render smoke (long-session transcript)
        # This step replaces the manual TUI check, and until now nothing ran it:
        # it existed as an npm script no workflow called, so it silently rotted
        # into `ERR_MODULE_NOT_FOUND` when the workspace dropped the `react` /
        # `ink` aliases — the harness resolved bare names that no longer existed.
        # A smoke that cannot load still reports "a check failed", which is why
        # its absence went unnoticed. Checked here so it cannot rot again.
        #
        # Bundles its own `scripts/render-smoke/dist` from `src` (sharing one
        # module instance with the stores), so it needs the build above but is
        # independent of the release config below; run before that one so a
        # failure is attributed to the source rather than to the release build.
        run: pnpm --filter @codent/app validate:render-smoke

      - name: Build the release configuration of @codent/app
        # `Build` above runs the DEFAULT app config, which keeps dependencies
        # external. The release config (`tsdown.config.release.ts`) is a second,
        # separate code path that only the release/publish scripts use — so
        # without this step a broken release config is first discovered at tag
        # time, after the tag is pushed, and the tagged commit is already
        # immutable. Building it here is cheap (it shares `tsdown.shared.ts`
        # with the default config, so the entry list cannot drift), and it
        # leaves `packages/app/dist` in the inlined state that the
        # self-containment check below must see.
        run: pnpm run build:app:release

      - name: Verify the bundled release CLI is self-contained
        # guards the release contract on every PR, not just at tag time: the
        # built `codent` tarball must contain no `@codent/*` specifier and must
        # declare only the four externals that cannot be inlined. Without this,
        # a new `@codent/*` import inside app/core/node would only be caught by
        # the release workflow, after the tag is already pushed.
        #
        # The script builds `codent` itself (`validate:self-contained` is
        # `pnpm run build && node ./scripts/...`), so do NOT wrap it in
        # `pnpm build:codent` — that would rebuild the release app config a
        # second time on top of the step above.
        run: pnpm --filter codent validate:self-contained

      - name: Verify no bundle references an undeclared specifier
        # The other half of the contract, and the half `validate:self-contained`
        # cannot see: a lazy `import()` of a package that is neither inlined nor
        # in `dependencies`. That resolves inside this monorepo — devDependencies
        # are installed here — and throws ERR_MODULE_NOT_FOUND for a consumer, on
        # whichever code path reaches it.
        #
        # Deliberately after the self-containment step: that one rebuilds
        # `dist`, so scanning earlier would scan a stale bundle.
        run: pnpm --filter codent validate:runtime-specifiers
