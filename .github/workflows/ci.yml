name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      # Keep the pnpm content-addressable store between runs. Every job in every
      # workflow installs the same ~540-package tree, and a cold store makes the
      # install (documented at 121-141s) dominate the build. `pnpm store path`
      # is constant on a given OS, so the key is too.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '/home/runner/.local/share/pnpm/store' || '~/Library/pnpm/store' }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @codent/extension exec wxt prepare

      - name: Build
        # Must precede Lint and Typecheck: the 266 validate/test/smoke scripts
        # import their own package's `dist` (e.g. `../dist/dev.mjs`), and
        # cross-package imports resolve through the `exports` map, which points
        # at `dist`. On a dist-less checkout `import/no-unresolved` and `tsc`
        # report ~280 phantom errors for imports that are correct by
        # construction — the scripts' own `build &&` prefix is what satisfies
        # them locally. See the "Build state is a lint/typecheck prerequisite"
        # note in eslint.config.cjs.
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # @codent/app is the only package with a node:test suite; it imports
        # its own dist entry, so it must run after the build above.
        run: pnpm --filter @codent/app test

      - name: Verify the bundled release CLI is self-contained
        # guards the release contract on every PR, not just at tag time: the
        # built `codent` tarball must contain no `@codent/*` specifier and must
        # declare only the four externals that cannot be inlined. Without this,
        # a new `@codent/*` import inside app/core/node would only be caught by
        # the release workflow, after the tag is already pushed.
        run: pnpm --filter codent validate:self-contained
