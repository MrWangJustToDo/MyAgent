name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate WXT types (extension .wxt)
        # --ignore-scripts skips the extension postinstall ("wxt prepare"), so
        # ./.wxt/tsconfig.json is never generated. Required for the extension
        # typecheck (tsconfig extends ./.wxt/tsconfig.json) and for the
        # playground build (vite 8 oxc tsconfig auto-discovery loads the root
        # tsconfig's references, including packages/extension).
        run: pnpm --filter @my-agent/extension exec wxt prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        # @my-agent/app is the only package with a node:test suite; it imports
        # its own dist entry, so it must run after the build above.
        run: pnpm --filter @my-agent/app test
